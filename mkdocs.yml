site_name: Knowledge Hub

theme:
  name: material
  logo: assets/logo_image.png
  favicon: assets/logo_image.png

  palette:
    - scheme: default
      primary: blue
      accent: blue

  font:
    text: IBM Plex Mono
    code: IBM Plex Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/styles.css

plugins:
  - search

nav:
  - Home: index.md

  # 1. Foundations
  - Foundations:
      - Documentation Lifecycle Models: foundations/lifecycle.md
      - Audience & User Intent: foundations/audience.md
      - Types of Documentation: foundations/doc-types.md

  # 2. Content Design & Development
  - Content Design & Development:
      - Task-Based Writing: content/task-writing.md
      - Structuring for Readability: content/structuring.md
      - Style & Consistency: content/style.md

  # 3. Advanced Writing & Architecture
  - Advanced Communication:
      - API Documentation: advanced/api.md
      - Information Architecture: advanced/ia.md
      - Writing for Complex Systems: advanced/complex-systems.md

  # 4. Tools & Technology
  - Tools & Technology:
      - Authoring Tools: tools/authoring.md
      - Version Control & Collaboration: tools/collaboration.md
      - Publishing Pipelines: tools/publishing.md

  # 5. Professional Readiness
  - Professional Readiness:
      - Review & Quality Practices: professional/quality.md
      - Workplace Communication: professional/workplace-communication.md
      - Career Growth & Portfolio: professional/career.md
      - Measurement & Analytics: professional/analytics.md

  # 6. Emerging Trends
  - Emerging Trends:
      - AI in Documentation: trends/ai.md
      - Docs-as-Code Workflows: trends/docs-as-code.md
      - Content Personalization: trends/personalization.md

extra:
  generator: false

